 	{

for(var i = 0; i < linhas.length; i++){
	var linha = linhas[i];

	});
}
function selLinha(linha, multiplos){
	if(!multiplos){
  	var linhas = linha.parentElement.getElementsByTagName("tr");

      var linha_ = linhas[i];

    }
  }

}

//SELECT
	$.getJSON( "DespesaTipo.php", {} ).done(function(dados) 
		{
			for(i = 0; i < dados.length; i++)
			$('#despesas').append(new Option(dados[i][1], dados[i][0]))
			for(i = 0; i < dados.length; i++)
			$('#despesasfilt').append(new Option(dados[i][1], dados[i][0]))
 		})

	$.getJSON( "Despesaex.php", {} ).done(function(dados) 
		{

			$('#despesasex').append(new Option(dados[i][1], dados[i][0]))
 		})

	$.getJSON( "Pessoa.php", {} ).done(function(dados) 
		{
			document.getElementsByName("cpf")[0].value = dados[0][0];

 		})

    $('#bttcriar').click(function(e)

 	var data = document.getElementsByName("data")[0].value;
    var cpf = document.getElementsByName("cpf")[0].value;
	if(despesa != "" && valor != "" && data != "" )
	{
		 		$.getJSON( "PerfilCriar.php", {despesa:despesa, valor:valor, data:data, cpf:cpf } ).done(function(dados) 
		{
			if (dados > 0)
			{
                alert("Criado com Sucesso")
				location.reload(true)
			}
			else
				alert("ALGO DEU ERRADO!!!")

 		})
	}
	else
	alert("Insira os Valores!!")	
    })


//CRIAR DESPESAS EXCLUSIVAS
	$('#bttcriarex').click(function(e)
 	{ 
 	var nome = document.getElementsByName("despesaex")[0].value;
	if(nome != "" )
	{
		 		$.getJSON( "PerfilCriarDespesa.php", {nome:nome} ).done(function(dados) 
		{
						if(dados == 1)
						{
                        alert("Criada com Sucesso")
						location.reload(true)
						}
						else if(dados == 0)
						{
						alert("Essa Despesa já Existe")
						}
 		})
	}
	else
	alert("Insira o Nome da sua Despesa Exclusiva!!")	
    })


//APAGAR DESPESAS EXCLUSIVAS
	$('#bttdeletarex').click(function(e)
 	{ 
 	var id = document.getElementsByName("despesasex")[0].value;
	if(id != "" )
	{
		 		$.getJSON( "PerfilDeletarDespesa.php", {id:id} ).done(function(dados) 
		{
			if(dados == 1)
			{
            	alert("Deletada com Sucesso")
				location.reload(true)
			}
			else if(dados == 3)
			alert("Essa despesa Esta sendo usada")

 		})
	}
	else
	alert("Selecione uma despesa criada por você!!")	
    })


//FILTRO
	$('#bttfiltrar').click(function(e)
 	{
		CODIGO ="";
		var inicial = document.getElementsByName("defiltro")[0].value;
		var final = document.getElementsByName("atefiltro")[0].value;
		var valor = document.getElementsByName("valorfilt")[0].value;
		var valorfilt = document.getElementsByName("valortamanho")[0].value;
		var despesa = document.getElementsByName("despesasfilt")[0].value;
		if(inicial != "" || final != "" || valor != "" || despesa != "")
		{
			$(".semfiltro").remove();
			$.getJSON( "DespesasFiltro.php", {inicial:inicial, final:final, valor: valor, despesa:despesa, valorfilt:valorfilt} ).done(function(dados) 
		{
			for(i = 0; i < dados.length; i++)
			{
				markup = "<tr class='semfiltro'><td>" + dados[i]["dCodigo"] + "</td> <td>" + dados[i]["Descricao"] + "</td> <td>" + dados[i]["dataPagamneto"] + "</td> <td>" + dados[i]["Valor"] + "</td></tr>";
                $("table tbody").append(markup);
				if(i==0)
				CODIGO += dados[i]["dCodigo"];
				else
				CODIGO += ", " + dados[i]["dCodigo"];
			}
			
            var tabela = document.getElementById("minhaTabela");
	    var linhas = tabela.getElementsByTagName("tr");

for(var i = 0; i < linhas.length; i++){
	var linha = linhas[i];
  linha.addEventListener("click", function(){
		selLinha(this, false);
	});
}
function selLinha(linha, multiplos){
	if(!multiplos){
  	var linhas = linha.parentElement.getElementsByTagName("tr");
    for(var i = 0; i < linhas.length; i++){
      var linha_ = linhas[i];
      linha_.classList.remove("selecionado");    
    }
  }
  linha.classList.toggle("selecionado");
}
 		})
	$.getJSON( "DespesaTipo.php", {} ).done(function(dados) 
		{
			for(i = 0; i < dados.length; i++)
			$('#despesas').append(new Option(dados[i][1], dados[i][0]))
 		})

		 $.getJSON( "Pessoa.php", {} ).done(function(dados) 
		{
			document.getElementsByName("cpf")[0].value = dados[0][0];
    		document.getElementsByName("usuario")[0].value = dados[0][1];
 		})
		}
		else
		{
		alert("Não foi escolhido nenhum filtro")
		location.reload(true)
		}
    })


//GRAFICO
	$('#bttgrafico').click(function(e)
{
	if(count == 0)
	{
	alert('Clique Novamente Para Confimar!!');
	count++;
	}
	var dado = CODIGO;
	google.load('visualization', '1.0', {'packages':['corechart']});
 	$.getJSON( "GraficoSFILTRO.php", {dado:dado} ).done(function(dados) 
{
 google.setOnLoadCallback();
 var data = new google.visualization.DataTable();
 data.addColumn('string', 'Despesa');
 data.addColumn('number', 'Quantidades');
 data.addRows(dados);

 var config = {
 'title':'Despesa',
 'width':500,
 'height':250,
 'backgroundColor': '#573b8a'
 };

 	var chart=new google.visualization.PieChart(document.getElementById('teste2'));
 	chart.draw(data, config);
 })
})
})
 	</script>


</head>
<body>
	<div class="body">
    <input name="cpf" type="text" value="" hidden>
	<input name="usuario" type="text" value="" hidden>

	<form action="Profile.php" method="post">
	</div>

			<div class="CriarD">

			</div>

</div>

<script>
$('#data').keypress(function()
	{
		const cpf = document.getElementById('data')
		var cpfLeght = cpf.value.length
		if(cpf.value >=0 || cpf.value == "-")
		{
			if(cpfLeght == 2 || cpfLeght == 5)
   			cpf.value +='-'
		}
		else
		cpf.value = null;
	})
var tabela = document.getElementById("minhaTabela");

//EDITAR DESPESA
var btnVisualizar = document.getElementById("btteditar");
btnVisualizar.addEventListener("click", function(){
	var selecionados = tabela.getElementsByClassName("selecionado");
  	if(selecionados.length < 1){
  	alert("Selecione pelo menos uma linha");
    return false;
  }
  
  var id = "";
  var nome = "";
  
  	for(var i = 0; i < selecionados.length; i++){
  	var selecionado = selecionados[i];
    selecionado = selecionado.getElementsByTagName("td");
    id = selecionado[0].innerHTML;
    var despesa = document.getElementsByName("despesas")[0].value;
    var valor = document.getElementsByName("valor")[0].value;
 	var data = document.getElementsByName("data")[0].value;
  }
  if(despesa != "" && valor != "" && data != "" )
	{
		$.getJSON( "PerfilEditar.php", { id:id, despesa:despesa, valor:valor, data:data } ).done(function(dados) 
		{
			if (dados > 0)
			{
			 alert("Alterado!!")
			 location.reload(true)
			}
			else
				alert("ALGO DEU ERRADO!!!")
 				
 		})
	}
	else
	alert("Insira novos valores!")
});

//DELETAR DESPESA
var btnVisualizar = document.getElementById("bttdeletar");
btnVisualizar.addEventListener("click", function(){
	var selecionados = tabela.getElementsByClassName("selecionado");
  	if(selecionados.length < 1){
  	alert("Selecione pelo menos uma linha");
    return false;
  }
  
    var id = "";  
  	for(var i = 0; i < selecionados.length; i++){
  	var selecionado = selecionados[i];
    selecionado = selecionado.getElementsByTagName("td");
    id = selecionado[0].innerHTML;
  }
		$.getJSON( "PerfilDeletar.php", {id:id} ).done(function(dados) 
		{
			if (dados > 0)
			{
			 alert("Deletada!!")
			 location.reload(true)
			}
			else
				alert("ALGO DEU ERRADO!!!")
 				
 		})
});
</script>

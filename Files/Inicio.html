<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
	<link rel="stylesheet" type="text/css" href="inicio.css">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"> </script> 
<script type="text/javascript">
 $(document).ready(function()
 { 
	//LOGIN
 	$('#bttlogin').click(function(e)
 	{ 
 	var login = document.getElementsByName("cpflogin")[0].value;
 	var senha = document.getElementsByName("senhalogin")[0].value;
	if(login != "" && senha != "")
	{
		 		$.getJSON( "Login.php", { login: login, senha: senha } ).done(function(dados) 
		{
 			if (dados.length > 0)
				{ 
 				$.each(dados, function(i, obj)
 					{
						if(login == "Admin")
 						$(location).attr('href', 'PerfilADM.html');
						else
						$(location).attr('href', 'Perfil.html');

 					}) 
			 	}
			else
				alert("CPF ou Senha INCORRETA!!")
 				
 		})
	}
	else
	alert("Insira os Dados!!")
 })

 	//REGISTRAR
 	$('#bttregister').click(function(e)
 	{
	if(document.getElementsByName("senharegister")[0].value == document.getElementsByName("senhaconfregister")[0].value)
	{
 	var cpf = document.getElementsByName("cpfregister")[0].value;
 	var nome = document.getElementsByName("nomeregister")[0].value;
	var senha = document.getElementsByName("senharegister")[0].value;
	if(cpf != "" && nome != "" && senha != "")
	{
		 		$.getJSON( "Registro.php", {cpf:cpf, nome:nome, senha:senha} ).done(function(dados) 
		{
 			if (dados > 0)
			{
			 alert("Registrado!!")
			 location.reload(true)
			}
			else
				alert("Esse CPF já foi registrado!!!")				
 		})
	}
	else
	alert("Insira os Dados!!")
	}
	else
	alert("As Senhas Não Estão IGUAIS!!")
 })
 })

</script> 
</head>
<body>
	<label>Controlador de Despesas</label>
	<div class="main"> 
		<input type="checkbox" id="chk" aria-hidden="true">

			<div class="login">
				<form enctype="multipart/form-data"  method="POST">
					<label for="chk" aria-hidden="true">Login</label>
					<input id="cpflogin" type="text" maxlength="14" name="cpflogin" placeholder="Insira o CPF" pattern="([0-9]{3}.[0-9]{3}.[0-9]{3}-[0-9]{2})|(Admin)"title="Por favor use este formato: 000.000.000-00. USE SOMENTE NÚMEROS!!">
					<input id="senhalogin" type="password" name="senhalogin" placeholder="Insira a Senha" required="">
					<input type="button" id="bttlogin" name="bttlogin" value="Login"/>
				</form>
			</div>
			
			<div class="signup">
				<form enctype="multipart/form-data" method="POST">
					<label for="chk" aria-hidden="true">Registrar</label>
                    <input id="cpfregister" type="text" maxlength="14" name="cpfregister" placeholder="Insira o CPF" pattern="[0-9]{3}.[0-9]{3}.[0-9]{3}-[0-9]{2}"title="Por favor use este formato: 000.000.000-00. USE SOMENTE NÚMEROS!!">
					<input id="nomeregister" type="text" name="nomeregister" placeholder="Insira o Nome" pattern="[a-zA-Z\s]+" title="USE SOMENTE LETRAS!!" required="">
					<input id="senharegister" type="password" name="senharegister" placeholder="Insira a Senha" onkeyup='check();' required="">
					<input id="senhaconfregister" type="password" name="senhaconfregister" placeholder="Insira a Senha Novamente" onkeyup='check();' required="" >
					<input type="button" id="bttregister" name="bttregister" value="Registrar"/>
				</form>
			</div>
	</div>
</body>
<script>
		$('#cpflogin').keypress(function()
	{
		const cpf = document.getElementById('cpflogin')
		var cpfLeght = cpf.value.length
			if(cpfLeght == 3 || cpfLeght == 7)
				{

    				if(cpf.value != "Adm")
   					cpf.value +='.'
				}
			else if(cpfLeght == 11)
					cpf.value +='-'                   
	})
	$('#cpfregister').keypress(function()
	{
		const cpf = document.getElementById('cpfregister')
		let cpfLeght = cpf.value.length
    		if(cpfLeght === 3 || cpfLeght === 7)
    			{
        			if(cpf.value != "Adm")
       				cpf.value +='.' 
    			}
    				else if(cpfLeght === 11)
    				cpf.value +='-'                   
	});
	var check = function() 
	{
		if(document.getElementById('senharegister').value != "" && document.getElementById('senhaconfregister').value != "")
		{
    if (document.getElementById('senharegister').value == document.getElementById('senhaconfregister').value) 
    {
		document.getElementById('senharegister').style.background = 'green';	
      	document.getElementById('senhaconfregister').style.background = 'green';
    } 
    else 	
	{
		document.getElementById('senharegister').style.background = 'red';
        document.getElementById('senhaconfregister').style.background = 'red';
    }
		}
		else
		{
			document.getElementById('senharegister').style.background = '#e0dede';
        	document.getElementById('senhaconfregister').style.background = '#e0dede';
		}
  }
</script>
</html>
